<style>

#warn::after{color:var(--yel);clip-path:inset(55% 0 0 0);transform:translateX(.6cqw);mix-blend-mode:screen}

@media (prefers-reduced-motion:no-preference){
.shake{animation:sk .09s steps(2) infinite}
@keyframes sk{0%{transform:translate(-1.2%,.6%)}25%{transform:translate(1%,-.8%)}50%{transform:translate(-.6%,-1%)}75%{transform:translate(1.2%,.8%)}100%{transform:translate(0,0)}}

.k.on{background:var(--yel);color:#000;border-color:var(--yel)}

<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),ST=$('stage');
const W=480,H=270,WW=1120,WH=630,WALL=64;
// name, domain (used for door labels)
const R=[['The Empty Signal','OSINT'],['The Dead Telegram','Cryptography'],['The Intercept','Packet analysis'],['The Quiet Machine','Linux'],['The Broken Gate','Web security'],['The Living Ledger','Databases'],['The False Victim','Identity'],['The Ghost in the Machine','Malware'],['The Last Timestamp','Forensics'],['Patient Zero Is a System','Final case']];
const NP=[
{n:'Cmdr. Ila Sen',s:'Ila',P:{h:'#9a9aa8',s:'#d9a082',j:'#22222c',t:'#ffe600',l:'#111',e:'b'},L:['NEXUS went dark at 23:17. No breach alert, no attacker, no explanation.','Pick any door. Every room holds a piece of the same intrusion.','Follow the evidence. Do not follow the first name you find.']},
{n:'Rhea D\'Souza',s:'Rhea',P:{h:'#2a1010',s:'#c98e6c',j:'#0d4a4a',t:'#ff1a1a',l:'#222',e:'g'},L:['I built NEXUS. It has a feature in it that I do not recognise.','The Curator does not lie, but the Curator does omit.','Verify what I tell you. Then verify it again.']},
{n:'Kabir "Kite" Mehra',s:'Kabir',P:{h:'#3a2010',s:'#e0a884',j:'#b04a10',t:'#ffe600',l:'#1a1a3a',e:'c'},L:['Everyone thinks it was me. My login is in every log.','I only clicked one installer. It looked exactly like our sync tool!','If you find who really did this, please say it loudly.']}];

let mode='boot',ri=0,npcOpen=false,dlgT,cam={x:0,y:0};
const p={x:WW/2,y:WH/2+60,f:1,mv:false};
// random placement of 10 doors + 3 NPCs (min spacing, relaxed if crowded)
(function(){const pts=[[p.x,p.y]];const put=(d,y0)=>{for(let n=0;n<900;n++){const k=d*(1-n/1000),x=70+Math.random()*(WW-140),y=y0+Math.random()*(WH-y0-50);if(pts.every(q=>Math.hypot(q[0]-x,q[1]-y)>k)){pts.push([x,y]);return{x,y}}}return{x:100,y:y0}};
for(let i=0;i<10;i++){const q=put(125,WALL+62);D.push({x:q.x,y:q.y,i});sol.push([q.x-18,q.y-8,36,10])}
NP.forEach(n=>{const q=put(105,WALL+50);n.x=q.x;n.y=q.y;sol.push([q.x-6,q.y-6,12,8])})})();
// decor: wall terminals + floor text
const WN=[];for(let x=10,i=0;x<WW-60;i++){const w=70+(Math.random()*30|0);WN.push([x,w,i*7%CM.length]);x+=w+8}
const FS=Array.from({length:60},()=>[80+(Math.random()*(WW-200)|0),WALL+20+(Math.random()*(WH-WALL-40)|0),CM[Math.random()*CM.length|0]]);
const sl=(()=>{const c=document.createElement('canvas');c.width=1;c.height=3;const q=c.getContext('2d');q.fillStyle='rgba(0,0,0,.22)';q.fillRect(0,2,1,1);return X.createPattern(c,'repeat')})();
// ===== breach boot sequence =====
const mx=$('mx'),mc=mx.getContext('2d'),lg=$('lg'),bw=$('barw'),wr=$('warn'),bar=bw.firstElementChild,CS=12,GL='01ABCDEF<>/{}$#%';
let drops=[],bp=0,tm=[],iv,gi;
function sizeMx(){mx.width=ST.clientWidth;mx.height=ST.clientHeight;drops=Array.from({length:Math.ceil(mx.width/CS)},()=>Math.random()*-60)}
function rain(){if(mode!='boot')return;mc.fillStyle='rgba(5,0,0,.13)';mc.fillRect(0,0,mx.width,mx.height);mc.font=CS+'px monospace';
drops.forEach((y,i)=>{mc.fillStyle=Math.random()<.05?'#ffe600':'#ff1a1a';mc.fillText(GL[Math.random()*GL.length|0],i*CS,y*CS);drops[i]=y*CS>mx.height&&Math.random()>.96?0:y+1});requestAnimationFrame(rain)}
const shake=ms=>{ST.classList.add('shake');setTimeout(()=>ST.classList.remove('shake'),ms)};
const flash=()=>{const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')};
const at=(ms,f)=>tm.push(setTimeout(f,ms));
function decode(txt,ms,done){const t0=performance.now();iv=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms),n=Math.floor(k*txt.length);let o='';for(let i=0;i<txt.length;i++)o+=txt[i]==' '||i<n?txt[i]:GL[Math.random()*GL.length|0];wr.textContent=o;wr.dataset.t=o;if(k>=1){clearInterval(iv);done&&done()}},40)}
const MSG='THE SHOW MUST NOT CONTINUE';
const B=[[300,'MERAZ FESTIVAL // NEXUS v4.2  cold boot'],[350,'[ OK ] ticketing.core'],[250,'[ OK ] volunteer.roster'],[250,'[ OK ] artist.checkin'],[400,'[WARN] unsigned installer executed (k.mehra)','w'],[300,'[FAIL] identity.gateway','f'],[250,'[FAIL] payments.sync','f'],[300,'[WARN] unknown process MIRA-7  pid 1723','w'],[450,'23:17:00 >> WORM DETECTED','f'],[300,'CASCADE FAILURE: ALL SERVICES','f']];
function bootRun(){sizeMx();rain();let t=200;
B.forEach((b,i)=>{t+=b[0];at(t,()=>{lg.insertAdjacentHTML('beforeend','<span class="'+(b[2]||'')+'">'+b[1]+'\n</span>');bar.style.width=(i+1)/B.length*100+'%';if(i==4)shake(250);if(i==8){shake(700);flash()}})});
at(t+800,()=>{bp=2;lg.hidden=bw.hidden=true;wr.hidden=false;wr.classList.add('g');shake(1400);flash();
decode(MSG,1500,()=>at(500,()=>{$('sub').hidden=$('press').hidden=false;bp=3;shake(300)}));
gi=setInterval(()=>{if(Math.random()<.4)shake(150)},1800)})}
function bootKey(){if(bp<3){tm.forEach(clearTimeout);clearInterval(iv);lg.hidden=bw.hidden=true;wr.hidden=$('sub').hidden=$('press').hidden=false;wr.textContent=wr.dataset.t=MSG;wr.classList.add('g');bp=3;return}
clearInterval(gi);$('boot').hidden=true;mode='hub';ST.dataset.m='hub'}
// ===== input =====
const map={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d'},kn={KeyW:'W',ArrowUp:'W',KeyA:'A',ArrowLeft:'A',KeyS:'S',ArrowDown:'S',KeyD:'D',ArrowRight:'D',KeyE:'E'};
const cap=(n,on)=>document.querySelectorAll('#keys .k[data-k="'+n+'"]').forEach(e=>e.classList.toggle('on',on));
addEventListener('keydown',e=>{const m=map[e.code];if(m){K[m]=1;e.preventDefault()}if(kn[e.code])cap(kn[e.code],1);if(e.repeat)return;
if(mode=='boot')return bootKey();
if(e.code=='KeyE'||e.code=='Enter')interact();else if(e.code=='Escape')mode=='room'?leave():($('dlg').hidden=true)});
addEventListener('keyup',e=>{const m=map[e.code];if(m)K[m]=0;if(kn[e.code])cap(kn[e.code],0)});
const pk={W:'u',A:'l',S:'d',D:'r'};
document.querySelectorAll('#keys .k').forEach(el=>{const n=el.dataset.k;
el.addEventListener('pointerdown',e=>{e.preventDefault();cap(n,1);if(pk[n])K[pk[n]]=1;else interact()});
['pointerup','pointerleave'].forEach(v=>el.addEventListener(v,()=>{cap(n,0);if(pk[n])K[pk[n]]=0}))});
$('boot').addEventListener('pointerdown',()=>mode=='boot'&&bootKey());
// ===== interaction =====
function say(h,b,f){npcOpen=false;const d=$('dlg');d.innerHTML='<b>'+h+'</b>'+b+(f?'<i>'+f+'</i>':'');d.hidden=false}
function talk(i){const c=NP[i],k=NT[i]++%c.L.length;say(c.n,c.L[k],'E: next line ('+(k+1)+'/'+c.L.length+')');npcOpen=true}
function near(){let b=null,bd=34;for(const d of D){const e=Math.hypot(p.x-d.x,p.y-(d.y+6));if(e<bd){bd=e;b={t:'door',i:d.i}}}
NP.forEach((n,i)=>{const e=Math.hypot(p.x-n.x,p.y-n.y);if(e<bd){bd=e;b={t:'npc',i}}});return b}
function interact(){mode=='room'?leave():act()}
function act(){const n=near();if(!n)return;if(n.t=='npc')return talk(n.i);
visited[n.i]=1;ri=n.i;$('rn').textContent='ROOM '+(n.i+1);mode='room';ST.dataset.m='room';$('dlg').hidden=true;npcOpen=false;K.l=K.r=K.u=K.d=0}
function leave(){const d=D.find(q=>q.i==ri);p.x=d.x;p.y=d.y+16;mode='hub';ST.dataset.m='hub'}
// ===== movement: free 2D =====
const hit=(x,y)=>sol.some(s=>x-5<s[0]+s[2]&&x+5>s[0]&&y-4<s[1]+s[3]&&y>s[1]);
function step(k){let dx=(K.r?1:0)-(K.l?1:0),dy=(K.d?1:0)-(K.u?1:0);p.mv=!!(dx||dy);if(!p.mv)return;
const m=Math.hypot(dx,dy);dx*=1.9*k/m;dy*=1.9*k/m;if(dx)p.f=dx>0?1:-1;
const nx=Math.max(14,Math.min(WW-14,p.x+dx));if(!hit(nx,p.y))p.x=nx;
const ny=Math.max(WALL+24,Math.min(WH-12,p.y+dy));if(!hit(p.x,ny))p.y=ny}
// ===== drawing =====
function icon(i,cx,cy,c,s=1){X.save();X.translate(cx,cy);X.scale(s,s);X.strokeStyle=c;X.fillStyle=c;X.lineWidth=2;const B=()=>X.beginPath();
switch(i){
case 0:B();X.ellipse(0,0,14,8,0,0,7);X.stroke();X.fillRect(-3,-3,6,6);break;
case 1:B();X.arc(-6,0,6,0,7);X.stroke();X.fillRect(0,-1,14,3);X.fillRect(9,2,3,5);X.fillRect(13,2,3,4);break;
case 2:[4,10,16,8,14,6,12].forEach((h,k)=>X.fillRect(-15+k*5,-h/2,3,h));break;
case 3:X.strokeRect(-14,-10,28,20);B();X.moveTo(-9,-4);X.lineTo(-4,0);X.lineTo(-9,4);X.stroke();X.fillRect(0,4,8,2);break;
case 4:X.fillRect(-14,-10,4,22);X.fillRect(10,-10,4,22);B();X.arc(0,-8,10,Math.PI,0);X.stroke();X.fillRect(-1,-8,2,20);break;
case 5:[-9,0,9].forEach(y=>{B();X.ellipse(0,y,12,4,0,0,7);X.stroke()});X.fillRect(-13,-9,2,18);X.fillRect(11,-9,2,18);break;
case 6:B();X.arc(0,-5,6,0,7);X.stroke();B();X.arc(0,14,13,Math.PI,0);X.stroke();break;
case 7:B();X.ellipse(0,2,7,9,0,0,7);X.stroke();[-6,0,6].forEach(y=>{X.fillRect(-14,y+2,7,2);X.fillRect(7,y+2,7,2)});X.fillRect(-5,-11,2,4);X.fillRect(3,-11,2,4);break;
case 8:B();X.arc(0,0,12,0,7);X.stroke();X.fillRect(-1,-8,2,9);X.fillRect(0,0,7,2);break;
default:B();X.moveTo(0,-13);X.lineTo(13,0);X.lineTo(0,13);X.lineTo(-13,0);X.closePath();X.stroke();X.fillRect(-4,-4,8,8)}
X.restore()}
function txt(t,x,y,c,sz=6){X.font=sz+'px "Press Start 2P",monospace';X.textAlign='center';X.fillStyle=c;X.fillText(t,Math.round(x),Math.round(y))}
function hero(x,y,f,mv,t,P){P=P||{h:'#b01828',s:'#e8a37e',j:'#160a0a',t:'#ffe600',l:'#0d3a3a'};X.save();X.translate(Math.round(x),Math.round(y));X.scale(f,1);const b=mv?(t>>7&1):0;
X.fillStyle='rgba(0,0,0,.5)';X.fillRect(-7,-1,14,3);
X.fillStyle=P.h;X.fillRect(-6,-23,12,7);X.fillRect(-7,-20,2,6);X.fillRect(5,-20,2,4);
X.fillStyle=P.s;X.fillRect(-4,-17,8,6);X.fillStyle=P.j;X.fillRect(-5,-11,10,8);
X.fillStyle=P.t;X.fillRect(-5,-5,10,2);X.fillRect(-1,-11,2,6);
if(P.e=='g'){X.fillStyle='#000';X.fillRect(-4,-15,3,2);X.fillRect(1,-15,3,2);X.fillRect(-1,-15,2,1)}
if(P.e=='c'){X.fillStyle=P.t;X.fillRect(-6,-25,12,3);X.fillRect(2,-23,6,2)}
if(P.e=='b'){X.fillStyle=P.h;X.fillRect(-2,-27,4,4)}
X.fillStyle=P.l;X.fillRect(-4,-3-b,3,3+b);X.fillRect(1,-4+b,3,4-b);X.restore()}
function door(d,t,n){const sx=Math.round(d.x-cam.x),sy=Math.round(d.y-cam.y),v=visited[d.i],hot=n&&n.t=='door'&&n.i==d.i,c=hot&&(t>>8&1)?'#ffe600':v?'#ffe600':'#ff1a1a';
X.fillStyle='rgba(0,0,0,.5)';X.fillRect(sx-24,sy-3,48,6);X.fillStyle='#1f0000';X.fillRect(sx-22,sy-46,44,46);
X.strokeStyle=c;X.lineWidth=3;X.strokeRect(sx-22,sy-46,44,46);X.fillStyle=c;X.fillRect(sx-22,sy-46,7,7);X.fillRect(sx+15,sy-46,7,7);

X.fillStyle='#050000';X.fillRect(sx-7,sy-14,14,14);X.strokeStyle=c;X.lineWidth=2;X.strokeRect(sx-7,sy-14,14,14);X.fillStyle=v?'#ffe600':'#300';X.fillRect(sx-1,sy-12,2,12);}
function npc(c,i,t){const sx=c.x-cam.x,sy=c.y-cam.y;hero(sx,sy,Math.sign(p.x-c.x)||1,false,t,c.P);txt(c.s,sx,sy-31,'#ffd9d9',5);

function drawHub(t){const cx=cam.x|0,cy=cam.y|0,n=near();X.fillStyle='#0a0000';X.fillRect(0,0,W,H);
X.fillStyle='#220505';for(let x=-(cx%32);x<W;x+=32)X.fillRect(x,0,1,H);for(let y=-(cy%32);y<H;y+=32)X.fillRect(0,y,W,1);
X.fillStyle='#6a5a00';for(let x=-(cx%32);x<W;x+=32)for(let y=-(cy%32);y<H;y+=32)if(((x+cx)/32+(y+cy)/32)%5==0)X.fillRect(x-1,y-1,3,3);
X.textAlign='left';X.font='5px "Press Start 2P",monospace';X.fillStyle='#3a0d0d';for(const f of FS){const x=f[0]-cx,y=f[1]-cy;if(x>-90&&x<W&&y>0&&y<H)X.fillText(f[2],x,y)}
if(cy<WALL){X.fillStyle='#120202';X.fillRect(0,0,W,WALL-cy);
for(const[x,w,sd]of WN){const sx=x-cx,sy=6-cy;if(sx<-w||sx>W)continue;
X.fillStyle='#1a0303';X.fillRect(sx,sy,w,52);X.strokeStyle='#6a1010';X.lineWidth=1;X.strokeRect(sx+.5,sy+.5,w-1,51);
X.fillStyle='#4a0a0a';X.fillRect(sx,sy,w,7);X.fillStyle='#ff1a1a';[3,9,15].forEach(q=>X.fillRect(sx+q,sy+2,3,3));
X.textAlign='left';X.font='5px "Press Start 2P",monospace';for(let r=0;r<5;r++){X.fillStyle=r%3==0?'#a08a00':'#8a2a2a';X.fillText(CM[(sd+r)%CM.length].slice(0,(w-8)/5|0),sx+4,sy+17+r*8)}
if(t>>9&1){X.fillStyle='#ffe600';X.fillRect(sx+4,sy+44,4,5)}}
X.fillStyle='#ff1a1a';X.fillRect(0,WALL-cy,W,2)}
X.strokeStyle='#ff1a1a';X.lineWidth=3;X.strokeRect(3-cx,3-cy,WW-6,WH-6);
const E=[];D.forEach(d=>E.push([d.y,()=>door(d,t,n)]));NP.forEach((c,i)=>E.push([c.y,()=>npc(c,i,t)]));E.push([p.y,()=>hero(p.x-cx,p.y-cy,p.f,p.mv,t)]);
E.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]())}
// room entry: intentionally blank, only the room number
function drawRoom(){X.fillStyle='#000';X.fillRect(0,0,W,H)}
// HD door labels (DOM, crisp at screen resolution)
const LB=D.map(d=>{const e=document.createElement('div');e.className='lb';e.innerHTML='<em>ROOM '+(d.i+1)+'</em>'+R[d.i][0];ST.insertBefore(e,$('rn'));return e});
function labels(){const s=ST.clientWidth/W;D.forEach((d,i)=>{const x=d.x-cam.x,y=d.y-cam.y+8,e=LB[i],off=x<-70||x>W+70||y<-30||y>H+40;e.style.display=off?'none':'';if(!off){e.style.transform='translate('+(x*s).toFixed(1)+'px,'+(y*s).toFixed(1)+'px) translateX(-50%)';e.classList.toggle('v',!!visited[d.i])}})}
// ===== loop =====
let last=0;const t0=Date.now(),f2=v=>String(v).padStart(2,'0');
function loop(t){const k=Math.min(2,(t-last)/16.7||1);last=t;
if(mode=='hub'){step(k);cam.x=Math.max(0,Math.min(WW-W,p.x-W/2));cam.y=Math.max(0,Math.min(WH-H,p.y-H/2-10))}
mode=='room'?drawRoom():drawHub(t);X.fillStyle=sl;X.fillRect(0,0,W,H);
if(mode=='hub'){labels();const n=near(),pr=$('prompt');
$('h1').textContent='> HUB: meraz-gate';$('h2').textContent='Rooms visited '+visited.filter(Boolean).length+'/10  |  Allies briefed '+NT.filter(Boolean).length+'/3';$('h3').textContent='Walk anywhere. Any door, any order.';
if(npcOpen&&!(n&&n.t=='npc')){npcOpen=false;$('dlg').hidden=true}
const m=n?n.t=='npc'?'E: talk to '+NP[n.i].s:'E: enter Room '+(n.i+1):'';pr.hidden=!m||!$('dlg').hidden;pr.textContent=m;
const s=(Date.now()-t0)/1000|0;$('clk').innerHTML='23:'+f2(17+(s/60|0))+':'+f2(s%60)+'<small>NEXUS OFFLINE</small>'}
requestAnimationFrame(loop)}
addEventListener('resize',()=>mode=='boot'&&sizeMx());
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).finally(()=>{bootRun();requestAnimationFrame(loop)});
</script></body></html>
