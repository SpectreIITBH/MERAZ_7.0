<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Jack In</title>
    <!-- High-tech, premium cyber fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030000;
            --brand-red: #ff1a1a;
            --brand-dark-red: #7a0000;
            --brand-yellow: #ffe600;
            --glass-bg: rgba(10, 0, 0, 0.65);
            --glass-border: rgba(255, 26, 26, 0.2);
            --text-main: #ffffff;
            --text-muted: #8b8b99;
            --input-bg: rgba(25, 0, 0, 0.4);
            --font-ui: 'Space Grotesk', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-image: 
                linear-gradient(rgba(255, 26, 26, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 26, 26, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.4;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        
        .glow-red {
            background: radial-gradient(circle, var(--brand-red) 0%, transparent 60%);
            top: -20%;
            left: -10%;
        }

        .glow-dark {
            background: radial-gradient(circle, var(--brand-dark-red) 0%, transparent 60%);
            bottom: -20%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* Main Container */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 1050px;
            height: 650px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 4px; /* Sharper edges for cyber feel */
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 26, 26, 0.1);
        }

        /* Corner Accents */
        .auth-container::before, .auth-container::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--brand-red);
            z-index: 10;
            pointer-events: none;
        }
        .auth-container::before {
            top: -1px; left: -1px;
            border-right: none; border-bottom: none;
        }
        .auth-container::after {
            bottom: -1px; right: -1px;
            border-left: none; border-top: none;
        }

        /* Left Side: Brand/Visual */
        .visual-panel {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, rgba(30, 0, 0, 0.8), rgba(0, 0, 0, 0.9));
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 3rem;
            overflow: hidden;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            z-index: 2;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 26, 26, 0.5);
        }
        
        .brand-icon {
            width: 36px;
            height: 36px;
            border: 2px solid var(--brand-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--brand-red);
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--brand-red);
        }

        /* Abstract Cyber Visual */
        .cyber-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 1px dashed rgba(255, 26, 26, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate-grid 20s linear infinite;
        }
        
        .cyber-grid::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(255, 26, 26, 0.5);
            border-radius: 50%;
            animation: rotate-grid 15s linear infinite reverse;
        }

        .cyber-grid::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid var(--brand-red);
            background: rgba(255, 26, 26, 0.1);
            transform: rotate(45deg);
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.4);
        }

        @keyframes rotate-grid {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sys-status {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--brand-red);
            line-height: 1.6;
            opacity: 0.8;
        }

        /* Right Side: Form */
        .form-panel {
            flex: 1.2;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 2.5rem;
        }

        .form-header h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-family: var(--font-mono);
        }

        .form-header span.highlight {
            color: var(--brand-red);
        }

        /* Glass Form Container */
        .glass-form {
            position: relative;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-main);
            margin-bottom: 0.6rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '>>';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-red);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 2px;
            color: var(--brand-yellow);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--brand-red);
            background: rgba(255, 26, 26, 0.1);
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.2), inset 0 0 10px rgba(255, 26, 26, 0.1);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--brand-red);
            border-radius: 2px;
            background: rgba(255, 26, 26, 0.1);
            color: var(--text-main);
            font-weight: 600;
            font-family: var(--font-mono);
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            background: var(--brand-red);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--brand-red);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: dashed 1px var(--glass-border);
            border-top: 1px dashed var(--brand-red);
        }

        .divider span {
            padding: 0 1rem;
        }

        /* Tabs / Toggle */
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .tab {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            position: relative;
        }

        .tab:hover {
            color: var(--text-main);
        }

        .tab.active {
            color: var(--brand-red);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--brand-red);
            box-shadow: 0 -2px 10px var(--brand-red);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                width: 100%;
                border: none;
            }
            .visual-panel {
                display: none;
            }
            .form-panel {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Backgrounds -->
    <div class="ambient-glow glow-red"></div>
    <div class="ambient-glow glow-dark"></div>

    <div class="auth-container">
        
        <!-- Left: Visual Side -->
        <div class="visual-panel">
            <div class="brand-logo">
                <div class="brand-icon"></div>
                SPECTRE
            </div>
            
            <div class="cyber-grid"></div>

            <div class="sys-status">
                SYS.NODE: NIGHTJAR_01<br>
                ENC: AES-256-GCM<br>
                STATUS: SECURE CONNECTION<br>
                AWAITING AUTHENTICATION...
            </div>
        </div>

        <!-- Right: Form Side -->
        <div class="form-panel">
            
            <div class="auth-tabs">
                <div class="tab active">Jack-In (Login)</div>
                <div class="tab">Initialize (Register)</div>
            </div>

            <div class="form-header">
                <h2>Authenticate</h2>
                <p>Provide <span class="highlight">credentials</span> to access the network.</p>
            </div>

            <div class="glass-form">
                <div class="input-group">
                    <label>
                        <span>Codename</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="AGENT_USERNAME">
                    </div>
                </div>

                <div class="input-group">
                    <label>
                        <span>Access Code</span>
                        <a href="#" style="color: var(--text-muted); text-decoration: none; font-size: 0.75rem;">OVERRIDE?</a>
                    </label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="••••••••••••">
                    </div>
                </div>

                <button class="btn-primary">Execute Auth</button>

                <div class="divider">
                    <span>SECURE OAUTH</span>
                </div>

                <!-- Google Style Cyber Button -->
                <button class="btn-primary" style="background: transparent; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#ff1a1a"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#ff4d4d"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#b30000"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#800000"/></svg>
                    Google Jack-In
                </button>
            </div>
        </div>
    </div>

</body>
</html>
